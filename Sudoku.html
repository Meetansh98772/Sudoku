<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Sprint Challenge</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: url('https://www.transparenttextures.com/patterns/graphy.png'), linear-gradient(to right, #dfe9f3 0%, #ffffff 100%);
      text-align: center;
      padding: 2rem;
    }
    h1 {
      color: #2e86de;
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    #sudoku-board {
      display: grid;
      grid-template-columns: repeat(9, 40px);
      gap: 2px;
      justify-content: center;
      margin: 2rem auto;
    }
    input {
      width: 38px;
      height: 38px;
      text-align: center;
      font-size: 1.2rem;
      border: 1px solid #ccc;
    }
    input:disabled {
      background: #e8f0fe;
      font-weight: bold;
    }
    button {
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      border: none;
      background-color: #2e86de;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      margin: 1rem;
    }
    #timer, #leaderboard {
      margin-top: 1.5rem;
    }
    #leaderboard ul {
      list-style: none;
      padding: 0;
    }
    #cheer {
      font-size: 2rem;
      color: #28a745;
      margin-top: 1rem;
      animation: pop 0.5s ease-in-out;
    }
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.5); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <h1>🧩 Sudoku Sprint Challenge</h1>
  <div id="timer">⏱ Time: 0s</div>
  <div id="sudoku-board"></div>
  <button onclick="checkSudoku()">Submit</button>
  <div id="result"></div>
  <div id="cheer"></div>
  <div id="leaderboard">
    <h3>🏆 Leaderboard</h3>
    <ul id="leaders"></ul>
  </div>

  <script>
    let board = [];
    let timer = 0;
    let interval;
    const boardEl = document.getElementById("sudoku-board");

    function generateSudokuBoard() {
      boardEl.innerHTML = "";
      document.getElementById("cheer").textContent = "";
      board = generateSudoku();
      board.original.forEach((row, rIdx) => {
        row.forEach((val, cIdx) => {
          const cell = document.createElement("input");
          cell.setAttribute("maxlength", "1");
          if (val !== 0) {
            cell.value = val;
            cell.disabled = true;
          } else {
            cell.dataset.row = rIdx;
            cell.dataset.col = cIdx;
          }
          boardEl.appendChild(cell);
        });
      });
      timer = 0;
      document.getElementById("timer").textContent = `⏱ Time: 0s`;
      clearInterval(interval);
      interval = setInterval(() => {
        timer++;
        document.getElementById("timer").textContent = `⏱ Time: ${timer}s`;
      }, 1000);
    }

    function generateSudoku() {
      const puzzle = [
        [5, 3, 0, 0, 7, 0, 0, 0, 0],
        [6, 0, 0, 1, 9, 5, 0, 0, 0],
        [0, 9, 8, 0, 0, 0, 0, 6, 0],
        [8, 0, 0, 0, 6, 0, 0, 0, 3],
        [4, 0, 0, 8, 0, 3, 0, 0, 1],
        [7, 0, 0, 0, 2, 0, 0, 0, 6],
        [0, 6, 0, 0, 0, 0, 2, 8, 0],
        [0, 0, 0, 4, 1, 9, 0, 0, 5],
        [0, 0, 0, 0, 8, 0, 0, 7, 9]
      ];

      const solution = [
        [5,3,4,6,7,8,9,1,2],
        [6,7,2,1,9,5,3,4,8],
        [1,9,8,3,4,2,5,6,7],
        [8,5,9,7,6,1,4,2,3],
        [4,2,6,8,5,3,7,9,1],
        [7,1,3,9,2,4,8,5,6],
        [9,6,1,5,3,7,2,8,4],
        [2,8,7,4,1,9,6,3,5],
        [3,4,5,2,8,6,1,7,9]
      ];
      return { original: puzzle, solution: solution };
    }

    function checkSudoku() {
      const inputs = document.querySelectorAll("#sudoku-board input");
      let correct = true;
      inputs.forEach(input => {
        const r = input.dataset.row;
        const c = input.dataset.col;
        if (r !== undefined && c !== undefined) {
          const userVal = parseInt(input.value);
          const solVal = board.solution[r][c];
          if (userVal !== solVal) {
            correct = false;
            input.style.border = "2px solid red";
          } else {
            input.style.border = "1px solid #0f0";
          }
        }
      });

      if (correct) {
        clearInterval(interval);
        document.getElementById("result").textContent = `✅ Completed in ${timer}s!`;
        document.getElementById("cheer").textContent = "🎉 Woohoo! You solved it! 🧠✨";
        const name = prompt("Enter nickname for leaderboard:");
        if (name) {
          addToLeaderboard(name, timer);
        }
      } else {
        document.getElementById("result").textContent = "❌ Incorrect! Try again.";
        document.getElementById("cheer").textContent = "";
      }
    }

    function addToLeaderboard(name, time) {
      let scores = JSON.parse(localStorage.getItem("sudokuScores") || "[]");
      scores.push({ name, time });
      scores = scores.sort((a, b) => a.time - b.time).slice(0, 5);
      localStorage.setItem("sudokuScores", JSON.stringify(scores));
      displayLeaderboard();
    }

    function displayLeaderboard() {
      let scores = JSON.parse(localStorage.getItem("sudokuScores") || "[]");
      const list = document.getElementById("leaders");
      list.innerHTML = "";
      scores.forEach(score => {
        const li = document.createElement("li");
        li.textContent = `${score.name} - ${score.time}s`;
        list.appendChild(li);
      });
    }

    window.onload = () => {
      generateSudokuBoard();
      displayLeaderboard();
    };
  </script>
</body>
</html>
